<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <title>Alô, JavaScript</title>
    </head>

    <body>
        <p>Observe que o conteúdo da página é carregado ANTES
            que o <code>&lt;script&gt;</code> seja executado</p>

        <!--
        Colocar todo o código JavaScript dentro de um bloco <script> não é uma boa
        ideia (o HTML pode ficar grande demais e difícil de manter).

        Vantagem de um arquivo separado: o navegador baixa o arquivo e o guarda em cache.
        Outras páginas que referenciam o mesmo script usam a cópia do cache em vez de
        baixá-lo de novo, então o arquivo é baixado só uma vez.

        Por isso, colocamos o código em um arquivo .js separado e o importamos
        com o atributo src, indicando o caminho (path) do arquivo.

        Importante: são obrigatórias as tags de abertura E de fechamento!
        Não use self-closing: <script src="..." />
        Motivo: <script> não é um elemento void. O "/" é ignorado pelo HTML, então
        o navegador considera o script ainda aberto e ele pode "engolir" o conteúdo seguinte.

        Fonte: MDN, <script> ("Tag omission: None, both the starting and ending tag are mandatory")
        https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script
        -->
        <script src="script3.js"></script>

        <!-- Os atributos type e language não são necessários.
            Um script externo é inserido com <script src="caminho/para/script.js"></script> -->

        <!-- Dica final: pode-se usar mais de uma tag <script> para importar vários arquivos
            JavaScript no mesmo HTML. Eles são executados NA ORDEM em que aparecem
            (veja 4a_dica-cuidado-com-ordem-script-tag):

            <script src="/js/script1.js"></script>
            <script src="/js/script2.js"></script>
            <script src="/js/script3.js"></script>
        -->

    </body>

</html>
