<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <title>Alô, JavaScript</title>

        <!-- Usando <script> dentro de <head> é uma forma de vincular código JavaScript à página -->
        <script>
            // alert é uma built-in function do JavaScript
            // The <script> tag contains JavaScript code which is automatically executed when the
            // browser processes the tag. The old HTML standard, HTML4, required a script to have a
            // type. Usually it was type="text/javascript". It’s not required anymore in HTML5, and
            // the default is JavaScript, so we can omit it.
            // The language attribute: <script language="javascript"> This attribute was meant to
            // show the language of the script. This attribute no longer makes sense because
            // JavaScript is the default language
            alert("Alô, JavaScript!");
        </script>
    </head>

    <body>
        <p>(...depois do script) Observe que conteúdo da página é carregado somente
            DEPOIS que o bloco <code>&lt;script&gt;</code> é carregado</p>
    </body>

</html>
