<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <title>Alô, JavaScript</title>
    </head>

    <body>
        <p id="paragrafo">(... antes do script) Observe que o conteúdo da página é carregado ANTES
            que o bloco <code>&lt;script&gt;</code> seja executado</p>

        <!-- Usar <script> no final do <body> é outra forma de vincular código JavaScript à página.
            Como o HTML acima já foi processado, o script consegue acessar esses elementos.
            Fonte: MDN, O que é JavaScript? (Adding JavaScript to a page)
            https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/What_is_JavaScript -->
        <script>
            // COMPARE com 1_script-tag-at-head.html: lá o mesmo console.log mostra null.
            // Aqui o parser já leu o <p> e o adicionou ao DOM (a árvore de objetos do documento)
            // ANTES de executar este script, então o JavaScript consegue encontrar o elemento.
            // Veja no Console (F12, no Chrome):  <p id="paragrafo">(... antes do script) ...</p>
            // e já seria seguro usar o elemento, por exemplo: elem.textContent = "..."
            // Fonte: MDN, Document.getElementById()
            // https://developer.mozilla.org/en-US/docs/Web/API/Document/getElementById
            console.log(document.getElementById("paragrafo")); // o elemento <p>

            // alert() é um método de window (Web API do navegador), não da linguagem JavaScript
            alert("Alô, JavaScript!");
        </script>
    </body>

</html>
