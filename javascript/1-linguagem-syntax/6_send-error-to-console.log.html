<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <title>Console</title>
    </head>

    <body>
        <!-- Demonstra saída implícita de erro no console do DevTools do navegador -->
        <p>Erros não tratados no código JavaScript também aparecem no console do
            DevTools do navegador, mesmo sem chamar <code>console.log()</code></p>
        <script>
            // O erro é registrado pelo próprio navegador (não pelo console.log).
            // Abra o DevTools (F12, no Chrome) → aba Console.
            const k = 9;
            k = k + 1; // erro: Uncaught TypeError: Assignment to constant variable.
            // Experimente trocar const por let e veja o erro desaparecer.
            // Fonte: MDN, TypeError: invalid assignment to const
            // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Errors/Invalid_const_assignment
        </script>
    </body>

</html>
