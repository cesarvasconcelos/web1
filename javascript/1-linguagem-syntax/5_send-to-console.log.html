<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <title>Console</title>
    </head>

    <body>
        <!-- Demonstra saída explícita no console do DevTools do navegador -->
        <p>Chamadas explícitas a <code>console.log()</code> aparecem no console do
            DevTools do navegador quando há um código JavaScript vinculado a uma
            página HTML</p>
        <script>
            // Para ver a saída: abra o DevTools (F12, no Chrome)
            // e vá na aba Console. Qualquer navegador tem DevTools equivalente.
            // Fonte: MDN, console.log() - https://developer.mozilla.org/en-US/docs/Web/API/console/log_static
            const numeroAleatorio = Math.random();
            // console.log aceita vários valores separados por vírgula
            console.log("O valor do número aleatório é:", numeroAleatorio);
        </script>
    </body>

</html>
