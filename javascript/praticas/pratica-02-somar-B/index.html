<!DOCTYPE html>
<html lang="pt">

    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Dobro</title>
        <!--
        VERSÃO B (refatoração da versão A): o JavaScript saiu do HTML e foi para o arquivo index.js.
        Vantagens: HTML mais limpo, e o navegador guarda o arquivo .js em cache (baixa uma vez só).

        POR QUE defer? (esta é a grande diferença de comportamento em relação à versão A)
        Na versão A o script ficava no fim do <body>: só era lido depois de todo o HTML.
        Aqui o <script> está no <head> (o navegador o encontra cedo e já pode baixar o arquivo),
        e o atributo defer resolve o problema do bloqueio:

        - BLOQUEIA o parse do HTML? NÃO. O navegador baixa o index.js em paralelo,
          enquanto continua lendo o HTML normalmente.
        - Executa imediatamente? NÃO. O código só é executado DEPOIS que todo o HTML foi lido
          (e antes do evento DOMContentLoaded). Se houver vários scripts com defer, eles
          executam na ordem em que aparecem no HTML.
        - Então o que aconteceria SEM defer? O script bloquearia o parse: o navegador pausaria
          a leitura do HTML, baixaria (load) e executaria (evaluate) o arquivo e só depois
          continuaria, atrasando a exibição da tabela abaixo. Veja a pasta
          1_linguagem-syntax/4a_dica-cuidado-com-ordem-script-tag
          para o caso em que o código acessa elementos da página logo ao ser executado e quebra
          se estiver no <head> sem defer.
        - CONTRASTE COM A VERSÃO A:
            A: <script> inline no fim do <body>. Não há arquivo para baixar; o código é executado
               imediatamente, no momento em que o parser chega nele (depois de ler todo o HTML acima).
            B: <script src defer> no <head>. O arquivo começa a ser baixado cedo, em paralelo ao
               parse, e o código é executado só depois de todo o HTML ser lido.
            Resultado final parecido (a função fica disponível para o clique), mas a B começa o
            download mais cedo e nunca pausa o parse do HTML.
        - E async? Também não bloquearia o parse, mas executaria assim que o download terminasse,
          em qualquer momento e sem ordem garantida. Para este exemplo, defer é a escolha certa.

        Observações importantes:
        - defer só funciona em scripts EXTERNOS (com src). Em script inline ele é ignorado.
        - O onclick="somar()" continua funcionando: com defer o script ainda é "clássico", então
          a função declarada com "function" vira global.
        - Pegadinha: como o script só executa depois do parse, em tese o usuário poderia clicar
          no botão antes de somar() existir (conexão muito lenta) e veria o erro
          "ReferenceError: somar is not defined" no Console. Na prática é raro; é um motivo
          para, mais adiante, trocar onclick por addEventListener dentro do próprio .js.

        Fontes:
        - MDN, <script> (async, defer): https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script
        - MDN, Script loading strategies:
          https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Scripting/What_is_JavaScript
    -->
        <script src="index.js" defer></script>
    </head>

    <body>

        <table>
            <tr>
                <td><label>Digite um número:</label></td>
                <!-- type="number" (antes era "text"): o navegador passa a aceitar só números no campo
                 (e mostra setinhas de +/-). Mesmo assim, .value continua sendo uma STRING!
                 Fonte: https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/input/number -->
                <td><input type="number" id="num1"></td>
            </tr>
            <tr>
                <td><label>Digite outro número:</label></td>
                <td><input type="number" id="num2"></td>
            </tr>
            <tr>
                <td></td>
                <td><button type="button" onclick="somar()">Somar</button></td>
            </tr>

            <tr>
                <td>Resultado:</td>
                <td id="resultado">0</td>
            </tr>
        </table>

    </body>

</html>
